<h2 align="center">t2a23-canvas-Rovin.html</h2>
<body style="background-color: 7F7F7F;">
Click the button to draw basic shapes, then ask AI to help you add more!<br><br>

<input type="button" value="Draw Basic Shapes" onclick="{
  // 1. Clear the canvas first so shapes don't overlap when clicked twice
  myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);

  // 2. Draw a simple Line
  myContext.beginPath();
  myContext.lineWidth = 3;
  myContext.strokeStyle = 'black';
  myContext.moveTo(20,20);        // Start point (x, y)
  myContext.lineTo(150, 20);      // End point (x,y) ([Notification] Tactician moves Fiery to (-3,4))
  myContext.stroke();

  // 3. Draw a solid Rectangle
  myContext.fillStyle = 'blue';
  myContext.fillRect(30, 50, 100, 60); // (x, y, width, height)

  // 4. Draw a Circle
  myContext.beginPath();
  myContext.lineWidth = 5;
  myContext.strokeStyle = 'green';
  myContext.arc(220, 80, 40, 0, 2 * Math.PI); //(x, y, radius, start, end)
  myContext.stroke();

  // 5. Write some text
  myContext.fillStyle = 'red';
  myContext.font = '24px Arial';
  myContext.fillText('Hello World!', 30, 180); // ('text', x, y)

  // 6. cooler line
  myContext.beginPath();
  myContext.lineWidth = 3;
  myContext.strokeStyle = 'yellow';
  myContext.moveTo(20,220);        // Start point (x, y)
  myContext.lineTo(150, 250);      // End point (x,y)
  myContext.stroke();

  // 6. Purple Triangle
  myContext.beginPath();
  myContext.fillStyle = 'purple';
  myContext.moveTo(300,20);
  myContext.lineTo(350,100);
  myContext.lineTo(250,100);
  myContext.closePath();
  myContext.fill();

  // 7. Orange Oval
  myContext.beginPath();
  myContext.fillStyle = 'orange';
  myContext.ellipse(220,190,60,30,0,0,2*Math.PI);
  myContext.fill();

  // 8. Pink Rectangle
  myContext.fillStyle = 'pink';
  myContext.fillRect(350,130,100,60);

  // 9. Star
  myContext.beginPath();
  myContext.fillStyle = 'gold';
  myContext.strokeStyle = 'black';
  myContext.lineWidth = 2;
  myContext.moveTo(400,205);
  myContext.lineTo(412,230);
  myContext.lineTo(440,234);
  myContext.lineTo(420,253);
  myContext.lineTo(425,280);
  myContext.lineTo(400,267);
  myContext.lineTo(375,280);
  myContext.lineTo(380,253);
  myContext.lineTo(360,234);
  myContext.lineTo(388,230);
  myContext.closePath();
  myContext.fill();
  myContext.stroke();

  // 10. Smiley Face
  myContext.beginPath();
  myContext.strokeStyle = 'black';
  myContext.lineWidth = 3;
  myContext.arc(220,260,25,0,2*Math.PI);
  myContext.stroke();
}"><br><br>

<!-- Smaller canvas so everything fits on a 3/4 of a page -->
<canvas id="myCoolTag" width="500" height="300" style="border:1px solid #000000;"></canvas>

<script>
  // Set up global variables
  let myCanvas = document.getElementById('myCoolTag');
  let myContext = myCanvas.getContext('2d');
</script>
