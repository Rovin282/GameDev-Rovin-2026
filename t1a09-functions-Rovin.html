<body style="background-color: 7F7F7F;">
<script>

  function myExampleFunction(){
    let myIn01 = parseInt(document.getElementById('myText01').value)
    let mySum = myIn01 + myIn01
    let myReply = myIn01 + ' + ' + myIn01 + ' = ' + mySum
    return myReply
}
</script>
<script>

  function myExampleFunction2(){
    let myIn02 = parseInt(document.getElementById('myText02').value)
    let mySum2 = myIn02 + myIn02 + myIn02
    let myReply2 = myIn02 + ' * ' + ' 3 ' + ' = ' + mySum2
    return myReply2
}
</script>

<h2 align=center>t1a09-functions-by-Rovin.html</h2>

<a href="https://www.w3schools.com/js/js_functions.asp">Good reference to Javascript functions</a><br>
<br>
Functions are used to sensibly organize code. Then they are "Called" elsewhere.<br>
Information can alsop be passed to functions (that's more advanced).

<h4> Example working code</h4>

<input type=text id="myText01" value="3"><br>

<input type=button value="Function Example" onClick="{
  document.getElementById('myDiv01').innerHTML = myExampleFunction()
}">

<div id="myDiv01">...</div><br><br>

<input type=text id="myText02" value="4"><br>

<input type=button value="triple number" onClick="{
  document.getElementById('myDiv02').innerHTML = myExampleFunction2()
}">

<div id="myDiv02">...</div>
