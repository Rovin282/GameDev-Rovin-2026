<h4> Example working Classes code</h4>
Nothing: <input type=text id="myText01" value="Useless at the moment"><br>
<input type=button value="Example Class Set and Show Class Animal" onClick="{

  class myAnimal {
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
  }
  myShow(){
  document.getElementById('myDiv01').innerHTML = 'hello '+ this.myName + '. You are '+ this.myAge + ' years old<br>'
    }
  } // end class myAnimal.

    myDog = new myAnimal('Snickers', 5)
    myDog.myShow()

  }">

  <div id="myDiv01">...</div><br><br>

<h4> class code </h4>
<input type=button value="Show Class" onClick="{

  class myClass {
    constructor(passWords, passNumbers, passAsunder, passType) {
      this.myWords = passWords;
      this.myNumbers = passNumbers;
      this.myAsunder = passAsunder;
      this.myType = passType;
  }
  myShow(){
  document.getElementById('myDiv02').innerHTML = 'hello '+ this.myWords + '.<br> Numbers: '+ this.myNumbers + '.<br> Underlined thing with bold: ' + this.myAsunder + '<br> You can type here: ' + this.myType
    }
  } // end class myClass.

    myClassShow = new myClass('These are words', 12345, '<u>Hey this is <b>underlined!</b></u>', '<input type=text>')
    myClassShow.myShow()

  }">

  <div id="myDiv02">...</div>
